name: Build Image Filtration
on:
  push:
    branches: [main]
    tags: ['image-editor-v*']
    paths: ['ImageEditor/**', '.github/workflows/image-editor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        shell: bash
        run: |
          version=0.1.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="${GITHUB_REF_NAME#image-editor-v}"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          app="Image Filtration.app"
          mkdir -p "$app/Contents/MacOS"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>Image Filtration</string>
          <key>CFBundleIdentifier</key><string>com.pmeir99.imagefiltration</string>
          <key>CFBundleExecutable</key><string>ImageFiltration</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
          <key>CFBundleShortVersionString</key><string>$version</string>
          <key>LSMinimumSystemVersion</key><string>27.0</string>
          </dict></plist>
          PLIST
          xcrun swiftc -parse-as-library -O -target arm64-apple-macosx27.0 -sdk "$(xcrun --sdk macosx --show-sdk-path)" ImageEditor/ImageFiltration.swift -o "$app/Contents/MacOS/ImageFiltration"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          ditto -c -k --keepParent "$app" Image-Filtration-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Image-Filtration-macOS-arm64
          path: Image-Filtration-macOS-arm64.zip
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Image-Filtration-macOS-arm64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Image-Filtration-macOS-arm64.zip --repo "$GITHUB_REPOSITORY" --verify-tag --title "Image Filtration $GITHUB_REF_NAME" --notes "Standalone macOS image editor." --latest=false
